<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>配送状況確認</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP&display=swap" rel="stylesheet" />
        <link href="./global.css" rel="stylesheet" />
        <script type="module" src="./main.js"></script>
    </head>
    <body>
        <div class="panel">
            <!-- Header -->
            <div class="header">
                <h1>📦 配送状況確認</h1>
                <div class="sub">配送番号を入力して追跡</div>
            </div>

            <!-- Hero: tracking number -->
            <div class="tracking-hero">
                <span class="icon">📋</span>
                <input
                    type="text"
                    id="trackingNumber"
                    placeholder="配送番号を入力"
                    autocomplete="off"
                />
                <div class="detect-badge" id="detectBadge"></div>
                <div class="error-message" id="errorMessage">
                    配送番号を入力してください
                </div>
            </div>

            <!-- Carrier chips -->
            <div>
                <div class="section-label">配送業者</div>
                <div class="chip-row">
                    <button class="chip active" data-carrier="sagawa">
                        <span class="chip-icon">🚚</span>佐川急便
                    </button>
                    <button class="chip" data-carrier="yamato">
                        <span class="chip-icon">🐈</span>ヤマト運輸
                    </button>
                    <button class="chip" data-carrier="seino">
                        <span class="chip-icon">🦘</span>西濃運輸
                    </button>
                    <button class="chip" data-carrier="fukutsu">
                        <span class="chip-icon">🌅</span>福山通運
                    </button>
                    <button class="chip" data-carrier="okaken">
                        <span class="chip-icon">🦺</span>オカケン
                    </button>
                    <button class="chip" data-carrier="dhl">
                        <span class="chip-icon">🛩️</span>DHL
                    </button>
                    <button class="chip" data-carrier="fedex">
                        <span class="chip-icon">✈️</span>FedEx
                    </button>
                    <button class="chip" data-carrier="ocs">
                        <span class="chip-icon">🌐</span>OCS
                    </button>
                    <button class="chip" data-carrier="ydh">
                        <span class="chip-icon">🐼</span>YDH
                    </button>
                    <button class="chip" data-carrier="sfexpress">
                        <span class="chip-icon">🇨🇳</span>SF Express
                    </button>
                    <button class="chip" data-carrier="japanpost">
                        <span class="chip-icon">🏣</span>日本郵便
                    </button>
                </div>
            </div>

            <!-- Memo -->
            <input
                type="text"
                class="memo-input"
                id="memo"
                placeholder="メモ（品番・発送先など）"
                autocomplete="off"
            />

            <!-- Collapsible details -->
            <button class="details-toggle" id="detailsToggle" onclick="this.classList.toggle('open'); document.getElementById('detailsBody').classList.toggle('open');">
                <span class="arrow">▶</span> 詳細（指定日・サイズ・個口）
            </button>
            <div class="details-body" id="detailsBody">
                <input
                    type="text"
                    id="dateSlot"
                    placeholder="6/25 午前"
                    autocomplete="off"
                />
                <input
                    type="text"
                    id="size"
                    placeholder="80"
                    inputmode="numeric"
                    autocomplete="off"
                />
                <input
                    type="text"
                    id="itemCount"
                    placeholder="2"
                    inputmode="numeric"
                    autocomplete="off"
                />
            </div>

            <!-- Direction + Action inline -->
            <div class="inline-row">
                <div class="inline-group">
                    <div class="section-label">荷物区分</div>
                    <div class="seg-btns">
                        <button class="seg-btn active" data-direction="shipping">📤 発送</button>
                        <button class="seg-btn" data-direction="receiving">📥 受取</button>
                    </div>
                </div>
                <div class="inline-group">
                    <div class="section-label">確認方法</div>
                    <div class="seg-btns">
                        <button class="seg-btn active" data-action="navigate">遷移</button>
                        <button class="seg-btn" data-action="show-url">URL</button>
                        <button class="seg-btn" data-action="check-status">📡</button>
                    </div>
                </div>
            </div>

            <!-- CTA -->
            <button class="cta" id="checkBtn">配送状況を確認 →</button>

            <!-- URL output -->
            <div class="url-output" id="urlOutput">
                <div class="url-label">確認URL:</div>
                <div class="url-display" id="urlDisplay"></div>
                <div class="copy-buttons">
                    <button class="copy-btn" id="copyBtn">URLをコピー</button>
                    <button class="copy-btn copy-text-btn" id="copyTextBtn">テキスト全体をコピー</button>
                </div>
            </div>

            <!-- Status output -->
            <div class="url-output" id="statusOutput">
                <div class="url-label" id="statusLabel">📡 ステータス確認</div>
                <div class="url-display" id="statusBody"></div>
            </div>

            <!-- Saved list -->
            <div class="saved">
                <div class="saved-header">
                    <span class="saved-title">📋 保存済み</span>
                    <span class="saved-count" id="savedCount">0 / 8</span>
                </div>
                <div class="saved-list" id="savedList">
                    <p class="saved-empty">保存された追跡番号はありません</p>
                </div>
            </div>
        </div>
    </body>
</html>
